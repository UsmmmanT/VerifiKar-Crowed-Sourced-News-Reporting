services:
  # FastAPI Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verifikar-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./temp_uploads:/app/temp_uploads
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      - model
    networks:
      - verifikar-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ARQ Worker Service
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verifikar-worker
    env_file:
      - .env
    command: arq app.worker.WorkerSettings
    volumes:
      - ./temp_uploads:/app/temp_uploads
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      - model
    networks:
      - verifikar-network

  # Model Server Service
  model:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verifikar-model
    ports:
      - "8001:8001"
    env_file:
      - .env
    command: uvicorn app.services.model_server:app --host 0.0.0.0 --port 8001
    volumes:
      - model-cache:/root/.cache # Cache downloaded models
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - verifikar-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s # Models take time to load

networks:
  verifikar-network:
    driver: bridge

volumes:
  model-cache: # Persistent volume for model files
